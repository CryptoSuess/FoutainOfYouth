<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Fountain of Youth — a public library of useful websites."
    />
    <title>Fountain of Youth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <p class="hero-kicker">Public library</p>
        <h1 class="hero-brand">Fountain of Youth</h1>
        <p class="hero-tagline">A curated collection of useful websites.</p>
      </header>

      <section class="controls" aria-label="Search and filters">
        <label class="search-label" for="search">
          <span class="visually-hidden">Search sites</span>
          <input
            id="search"
            type="search"
            placeholder="Search by name, description, or tag…"
            autocomplete="off"
            spellcheck="false"
          />
        </label>
        <div
          id="categories"
          class="categories"
          role="group"
          aria-label="Filter by category"
        ></div>
        <p id="result-count" class="result-count" aria-live="polite"></p>
      </section>

      <main>
        <div id="sites" class="sites" aria-live="polite"></div>
        <p id="empty" class="empty" hidden>
          No sites match that search. Try another word or clear the filters.
        </p>
      </main>

      <footer class="footer">
        <p>
          Curated in the open.
          <a href="https://github.com/CryptoSuess/FoutainOfYouth">Suggest a site</a>
          via GitHub.
        </p>
      </footer>
    </div>

    <script src="js/app.js" defer></script>
  </body>
</html>
